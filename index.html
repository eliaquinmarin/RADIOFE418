<script type="text/javascript">
  (function() {
    var dominioAutorizado = "radiofe418.vercel.app"; // CAMBIA ESTO
    var hostnameActual = window.location.hostname;

    // Si el dominio no es el correcto y no estamos en local
    if (hostnameActual !== dominioAutorizado && 
        hostnameActual !== "www." + dominioAutorizado && 
        hostnameActual !== "localhost" && 
        hostnameActual !== "127.0.0.1") {
      
      // 1. Detenemos la carga de la página
      window.stop(); 

      // 2. Sobreescribimos todo el HTML para que no vean NADA
      document.documentElement.innerHTML = `
        <body style="background:#000; color:red; text-align:center; padding-top:100px; font-family:sans-serif;">
          <h1>🔒 ERROR DE LICENCIA</h1>
          <p>Este dominio no tiene autorización para mostrar este contenido.</p>
          <p>Serás redirigido al sitio oficial en 3 segundos...</p>
        </body>
      `;

      // 3. Redirigimos después de 3 segundos
      setTimeout(function() {
        window.location.replace("https://" + dominioAutorizado);
      }, 3000);
    }
  })();
</script>
