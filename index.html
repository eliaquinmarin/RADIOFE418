<!-- ==========================================================================
     CONTENEDOR DE CONTINGENCIA (SISTEMA HÍBRIDO: MODAL / TARJETA FLOTANTE)
     ========================================================================== -->
<div id="signal-error-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm transition-all duration-500 hidden">
    
    <!-- Cuadro de Alerta Principal -->
    <div id="signal-card-body" class="bg-brand-lightCard dark:bg-brand-card w-full max-w-sm rounded-3xl p-6 border border-zinc-200 dark:border-zinc-800 shadow-2xl relative transition-all duration-500 transform scale-100">
        
        <!-- SE ELIMINÓ EL BOTÓN GRANDE 'X' DE LA ESQUINA PARA EVITAR DISTRACCIONES -->

        <div class="text-center">
            <!-- Icono de Advertencia Dinámico -->
            <div id="signal-icon-box" class="w-16 h-16 bg-amber-500/20 text-amber-500 rounded-2xl flex items-center justify-center mx-auto mb-4 transition-all duration-300">
                <i id="signal-main-icon" class="fa-solid fa-triangle-exclamation text-2xl animate-bounce"></i>
            </div>
            
            <!-- Título Dinámico -->
            <h3 id="signal-modal-title" class="text-lg font-bold text-zinc-900 dark:text-white mb-2 transition-all duration-300">
                Señal en mantenimiento
            </h3>
            
            <!-- Descripción -->
            <p id="signal-modal-desc" class="text-xs text-zinc-500 dark:text-zinc-400 mb-6 leading-relaxed block transition-all duration-300">
                Estamos optimizando nuestra señal de streaming. Por favor, intenta de nuevo en unos instantes o acompáñanos en nuestro canal oficial.
            </p>
            
            <!-- Bloque de Botones Adaptativos -->
            <div id="signal-buttons-container" class="flex flex-col gap-2 w-full">
                <button id="btn-modal-direct" class="w-full py-3 text-xs font-black uppercase bg-gradient-to-r from-brand-neon to-brand-neonPink text-white rounded-xl shadow-lg transition-all active:scale-95 cursor-pointer">
                    Entendido
                </button>
                <a href="https://whatsapp.com/channel/0029Vb8ZXt605MUinpmOZJ0P" id="btn-modal-channel" target="_blank" class="w-full py-3 text-xs font-bold uppercase border border-zinc-300 dark:border-zinc-700 text-zinc-600 dark:text-zinc-400 bg-white/50 dark:bg-zinc-900/30 rounded-xl transition-all text-center block">
                    Canal de WhatsApp
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Alerta Flotante Temporal (Éxito de señal reactivada) -->
<div id="signal-success-toast" class="fixed bottom-6 right-6 z-[110] hidden items-center gap-3 bg-emerald-600 text-white px-5 py-3.5 rounded-2xl shadow-xl shadow-emerald-900/20 border border-emerald-500/30 animate-slide-in-right">
    <div class="w-7 h-7 bg-white/20 rounded-lg flex items-center justify-center shrink-0">
        <i class="fa-solid fa-circle-check text-sm text-white"></i>
    </div>
    <div>
        <p class="text-xs font-black uppercase tracking-wider m-0">Transmisión Online</p>
        <p class="text-[11px] font-medium opacity-90 m-0">Señal restablecida con éxito.</p>
    </div>
</div>

<style>
@keyframes slideInRight {
    from { transform: translateX(120%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
.animate-slide-in-right {
    animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
</style>

<script>
(function() {
    // Validar entorno global del reproductor
    if (typeof audio === 'undefined' || typeof playIcon === 'undefined') {
        console.warn("Módulo de contingencia: No se detectó la instancia global 'audio' o 'playIcon'.");
        return;
    }

    const modalContainer = document.getElementById('signal-error-modal');
    const cardBody = document.getElementById('signal-card-body');
    const iconBox = document.getElementById('signal-icon-box');
    const mainIcon = document.getElementById('signal-main-icon');
    const modalTitle = document.getElementById('signal-modal-title');
    const modalDesc = document.getElementById('signal-modal-desc');
    const buttonsContainer = document.getElementById('signal-buttons-container');
    const toastSuccess = document.getElementById('signal-success-toast');

    const btnDirect = document.getElementById('btn-modal-direct');
    const btnChannel = document.getElementById('btn-modal-channel');
    
    let temporizadorEspera = null;
    let esModoMinimizado = false;

    // A. ACTIVAR ALERTA (Fase Inicial: Modal Bloqueante Completo)
    function activarAlertaMantenimiento() {
        if (!modalContainer) return;
        if (esModoMinimizado) return;

        // Mostrar como Modal centrado con fondo oscuro original
        modalContainer.className = "fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md transition-all duration-500";
        cardBody.className = "bg-brand-lightCard dark:bg-brand-card w-full max-w-sm rounded-3xl p-6 border border-zinc-200 dark:border-zinc-800 shadow-2xl relative transition-all duration-500 transform scale-100 text-center";
        
        iconBox.className = "w-16 h-16 bg-amber-500/20 text-amber-500 rounded-2xl flex items-center justify-center mx-auto mb-4 transition-all duration-300";
        mainIcon.className = "fa-solid fa-triangle-exclamation text-2xl animate-bounce";
        
        modalTitle.className = "text-xl font-black text-zinc-900 dark:text-white mb-2 transition-all duration-300";
        modalTitle.textContent = "Señal en mantenimiento";
        
        modalDesc.className = "text-sm text-zinc-600 dark:text-zinc-300 mb-6 leading-relaxed block transition-all duration-300 font-medium";
        modalDesc.innerHTML = "Por favor, <span class='text-amber-500 font-bold'>espera 5 minutos y actualiza la página</span> para verificar si el problema ya se solucionó.";
        
        buttonsContainer.className = "flex flex-col gap-2 w-full";

        if (playIcon) {
            playIcon.className = "fa-solid fa-play text-xl ml-0.5";
        }

        const txtArtista = document.getElementById('sonic_artist');
        if (txtArtista && (typeof programaEnVivoActivo === 'undefined' || !programaEnVivoActivo)) {
            txtArtista.textContent = "Señal en mantenimiento";
        }
    }

    // B. MINIMIZAR CUADRO (Nueva versión discreta y con botón de actualizar integrado)
    function minimizarAlerta() {
        if (!modalContainer) return;
        esModoMinimizado = true;

        // Quitar fondo de bloqueo del viewport y fijar a la esquina inferior derecha de forma pasiva
        modalContainer.className = "fixed bottom-5 right-5 left-auto top-auto z-[100] p-0 bg-transparent backdrop-blur-0 pointer-events-none transition-all duration-500";
        
        // Tarjeta flotante "Píldora": Color zinc/gris elegante, súper compacta y limpia
        cardBody.className = "bg-zinc-900/95 dark:bg-zinc-800/95 text-white w-auto max-w-[190px] rounded-full px-4 py-2 border border-zinc-700/50 shadow-xl relative pointer-events-auto transition-all duration-500 transform scale-100 flex items-center gap-2.5 cursor-pointer hover:bg-black dark:hover:bg-zinc-900 active:scale-95";
        
        // Icono sutil de refrescar (giro suave)
        iconBox.className = "w-4 h-4 bg-transparent text-brand-neon flex items-center justify-center m-0 transition-all duration-300 shrink-0";
        mainIcon.className = "fa-solid fa-arrows-rotate text-xs animate-spin [animation-duration:3s]";
        
        // Texto minúsculo informativo a un lado del botón
        modalTitle.className = "text-[11px] font-bold uppercase tracking-wider text-zinc-200 m-0 transition-all duration-300 whitespace-nowrap";
        modalTitle.textContent = "Refrescar Página";
        
        // Ocultar por completo elementos pesados del modal antiguo
        modalDesc.className = "hidden";
        if (btnChannel) btnChannel.className = "hidden";
        if (buttonsContainer) buttonsContainer.className = "hidden";

        // ACCIÓN CLAVE: Al pulsar la pequeña píldora flotante, refresca la página por completo
        cardBody.onclick = function(e) {
            e.preventDefault();
            modalTitle.textContent = "Cargando...";
            window.location.reload();
        };
    }

    // C. DESACTIVAR TODO Y MOSTRAR EMISIÓN EXITOSA
    function senalRestablecidaCorrectamente() {
        if (modalContainer) {
            modalContainer.className = "hidden";
        }
        
        if (esModoMinimizado || (modalContainer && !modalContainer.classList.contains('hidden'))) {
            if (toastSuccess) {
                toastSuccess.classList.remove('hidden');
                toastSuccess.classList.add('flex');
                
                setTimeout(() => {
                    toastSuccess.classList.add('opacity-0');
                    setTimeout(() => {
                        toastSuccess.classList.remove('flex', 'opacity-0');
                        toastSuccess.classList.add('hidden');
                    }, 500);
                }, 4000);
            }
        }
        
        esModoMinimizado = false;
        if(cardBody) cardBody.onclick = null;
    }

    // Asignar los triggers para minimizar el aviso
    if (btnDirect) btnDirect.addEventListener('click', minimizarAlerta);
    if (btnChannel) btnChannel.addEventListener('click', minimizarAlerta);

    // D. SISTEMA ASÍNCRONO DE COMPROBACIÓN (FETCH)
    async function comprobarEstadoServidor(urlStream) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 12000);

        try {
            await fetch(urlStream, { method: 'GET', signal: controller.signal, mode: 'no-cors' });
            clearTimeout(timeoutId);
            if (!audio.paused) {
                senalRestablecidaCorrectamente();
            }
        } catch (err) {
            clearTimeout(timeoutId);
            console.error("Contingencia: El servidor de streaming sigue sin enviar paquetes estables.");
            activarAlertaMantenimiento();
        }
    }

    // E. DISPARADORES Y OYENTES DEL ELEMENTO AUDIO HTML5
    audio.addEventListener('error', () => {
        console.log("Contingencia: Error crítico en la reproducción del flujo de audio.");
        activarAlertaMantenimiento();
    });

    audio.addEventListener('waiting', () => {
        if (temporizadorEspera) clearTimeout(temporizadorEspera);

        temporizadorEspera = setTimeout(() => {
            if (audio.paused === false && audio.readyState < 3) {
                console.log("Contingencia: Búfer de red congelado. Verificando estado técnico...");
                comprobarEstadoServidor(audio.src);
            }
        }, 12000);
    });

    audio.addEventListener('playing', () => {
        if (temporizadorEspera) clearTimeout(temporizadorEspera);
        senalRestablecidaCorrectamente();
    });
})();
</script>
